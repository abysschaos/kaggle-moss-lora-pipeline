name: Bug 反馈 (Bug Report)
description: 反馈训练崩溃、显存 OOM、启动器异常或文档不一致问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交问题反馈！请尽量填写完整以下环境与配置信息，以便快速定位问题（提交日志前请务必隐去包含本地敏感路径或 Token 的内容）。

  - type: input
    id: app-version
    attributes:
      label: 项目版本号
      description: 可查看项目根目录 VERSION 文件、EXE 文件属性或 GUI 窗口标题（例如 1.2.2）
      placeholder: "v1.2.2"
    validations:
      required: true

  - type: dropdown
    id: run-mode
    attributes:
      label: 运行模式
      options:
        - Windows 本地 GUI (MOSS_LoRA_Trainer.exe / launch_ui.vbs)
        - Windows 本地 CLI (train_local.py / run_local.ps1)
        - 云端 Kaggle / Colab (train_moss.py / Notebook)
    validations:
      required: true

  - type: input
    id: hardware-env
    attributes:
      label: GPU 型号、显存容量与 PyTorch / CUDA 版本
      placeholder: "例如: RTX 4060 8GB / Windows 11 / PyTorch 2.5.1+cu124"
    validations:
      required: true

  - type: input
    id: trainer-config
    attributes:
      label: 底模变体与关键超参数配置
      description: 包括 variant、vram_preset、resolution、precision、algo、dora、target_preset 等
      placeholder: "例如: variant=heal, vram_preset=8g, resolution=1024, precision=bf16, algo=lora, dora=true"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 复现步骤与预期/实际现象
      placeholder: |
        1. 点击/执行了 ...
        2. 期望看到 ...
        3. 实际发生了 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 错误日志与控制台输出（如有）
      description: 请粘贴完整堆栈信息，注意脱敏个人目录名
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认使用纯英文且无空格的仓库与工作目录路径
          required: true
        - label: 我已核对日志中不包含个人密钥、Token 或敏感私人路径
          required: true
