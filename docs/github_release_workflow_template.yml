name: Release Native Launcher & Source

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Native Windows Launcher (Zero-Dependency csc.exe)
        shell: pwsh
        run: |
          ./scripts/build_exe.ps1
          if (-not (Test-Path "./MOSS_LoRA_Trainer.exe")) {
            throw "MOSS_LoRA_Trainer.exe build failed."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            MOSS_LoRA_Trainer.exe
